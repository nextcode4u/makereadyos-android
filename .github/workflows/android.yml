name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nextcode4u/MakeReadyOS
          ref: adecbb4bf10af6ec6fdccd5a0578391aae27385e
          path: web-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: npm --prefix web-source/apps/web ci
      - run: node scripts/bundle-web.mjs web-source
      - run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
