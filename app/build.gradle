plugins { id 'com.android.application' }

// Explicit opt-in keeps generic builds independent of any operator's Firebase project.
def firebaseEnabled = providers.gradleProperty('firebaseNotifications').orNull == 'true'
if (firebaseEnabled) {
    def firebaseConfig = rootProject.file('nonpublish/google-services.json')
    if (!firebaseConfig.isFile()) {
        throw new GradleException('Firebase build requires nonpublish/google-services.json')
    }
    def config
    try {
        config = new groovy.json.JsonSlurper().parse(firebaseConfig)
    } catch (Exception ignored) {
        throw new GradleException('Firebase client configuration is not valid JSON')
    }
    if (config.private_key || config.type == 'service_account') {
        throw new GradleException('A server credential must never be packaged in the Android app')
    }
    def client = config.client?.find { it.client_info?.android_client_info?.package_name == 'com.makereadyos.android' }
    if (!client?.client_info?.mobilesdk_app_id || !client.api_key?.getAt(0)?.current_key
            || !config.project_info?.project_id || !config.project_info?.project_number) {
        throw new GradleException('Firebase configuration must contain a complete com.makereadyos.android client')
    }
    apply plugin: 'com.google.gms.google-services'
    afterEvaluate {
        tasks.withType(com.google.gms.googleservices.GoogleServicesTask).configureEach {
            googleServicesJsonFiles.set([firebaseConfig])
        }
    }
}

android {
    namespace 'com.makereadyos.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.makereadyos.android'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.1.0-beta.3'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/webAssets')
    // Opt-in, locally ignored emulator TLS fixtures; never included in release builds.
    if (providers.gradleProperty('localEmulatorTls').orNull == 'true') {
        sourceSets.debug {
            manifest.srcFile rootProject.file('.local/emulator-debug/AndroidManifest.xml')
            res.srcDir rootProject.file('.local/emulator-debug/res')
        }
    }
}

tasks.register('requireWebBundle') {
    doLast {
        if (!layout.buildDirectory.file('generated/webAssets/web/index.html').get().asFile.exists()) {
            throw new GradleException('Bundle the web UI first: node scripts/bundle-web.mjs /path/to/MakeReadyOS')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'requireWebBundle' }
tasks.configureEach {
    if (name == 'validateSigningRelease') {
        doFirst {
            for (key in ['ANDROID_KEYSTORE', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']) {
                if (!System.getenv(key)) throw new GradleException("Release signing requires environment variable " + key)
            }
            def metadata = new groovy.json.JsonSlurper().parse(
                layout.buildDirectory.file('generated/webAssets/web/bundle-info.json').get().asFile)
            if (metadata.sourceDirty) throw new GradleException('Release builds require a clean web source checkout')
        }
    }
}

dependencies {
    if (firebaseEnabled) {
        implementation platform('com.google.firebase:firebase-bom:35.1.0')
        implementation 'com.google.firebase:firebase-messaging'
    }
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
